<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <span class="border trans" style="font-size: 40px">
        <center>Welcome all to this website</center>
    </span> </br>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topnav {
            overflow: hidden;
            background-color: #333;
        }

        .topnav a {
            float: left;
            color: #1affa3;
            text-align: center;
            text-decoration: none;
            font-size: 30px;
            padding: 14px 16px;
        }

        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }

        .topnav a.active {
            background-color: #ffe066;
            color: black;
        }

        .pimg3 {
            position: relative;
            opacity: 0.70;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .pimg3 {
            background-image: url('masala1.jpg');
            min-height: 400px;
        }

        .section {
            text-align: center;
            padding: 50px 80px;
        }

        .section-dark {
            background-color: #282e34;
            color: #ddd;
        }

        .ptext {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            color: #000;
            font-size: 27px;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        .ptext .border {
            background-color: #111;
            color: #fff;
            padding: 20px;
        }

        .ptext .border .trans {
            background-color: transparent;
        }

        @media(max-width:568px) {
            .pimg3 {
                background-attachment: scroll;
            }
        }

        .footer {
            position: fixed;
            left: 0px;
            bottom: 0px;
            width: 100%;
            background-color: black;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="topnav">
        <a class="active" href="home.html">Home</a>
        <a href="aboutus.html">About Us</a>
        <a href="gallery.html">Gallery</a>
        <a href="favplayers.html">Favorite Players</a>
    </div><br>
    <section class="section section-dark">
        <span>All @copy rights reserved by Taha Khan</span>
    </section>
</body>

</html>
