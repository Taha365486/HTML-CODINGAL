<!DOCTYPE html>

<body>
  <h2>JavaScript Arrays Methods</h2>  
<h2>Join() and pop()</h2>
<p>The join() method joins all elements of an array into a string and a pop() method removes the last element from an array.</p>
<p id="myjoin"></p>
<p id="my first Pop"></p>
<p id="my second Pop"></p>
<script>
var fruits = ["Banana", "Orange", "Apple", "Mango"];
document.getElementById("myjoin").innerHTML = fruits.join(" * ");
document.getElementById("my first Pop").innerHTML = fruits.pop();
document.getElementById("my second Pop").innerHTML = fruits;
</script>

</body>
</html>
