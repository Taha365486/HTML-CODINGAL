<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JavaScript Variables</h1>
    <p>Sum of two nummbers</p>
    <p id="result"></p>
    <p id="result 1"></p>
    <p id="result 2"></p>
    <p id="result 3"></p>

    <script>
        var a = 5; //statement 1
        var b = 10; //statement 2
        var sum = a + b; //statement 3
        var sub = a - b;
        var mul = a * b;
        var div = a / b;
        document.getElementById("result").innerHTML = "The sum of " + a + " and " + b + " is: " + sum; //statement 4
        document.getElementById("result 1").innerHTML = "The difference of " + a + " and " + b + " is: " + sub;
        document.getElementById("result 2").innerHTML = "The product of " + a + " and " + b + " is: " + mul;
        document.getElementById("result 3").innerHTML = "The quotient of " + a + " and " + b + " is: " + div;
    </script>
</body>
</html>
